<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nestly - find a place to stay</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 0; list-style: none; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 12px; position: relative; }
    .heart { position: absolute; top: 8px; right: 8px; border: 0; background: none; font-size: 1.4rem; cursor: pointer; }
    .heart.is-active { color: #e0245e; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Nestly</h1>
    <div id="app"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
