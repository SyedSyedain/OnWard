# Render Blueprint for the OnWard API. The web client deploys separately on Vercel (client/vercel.json).
services:
  - type: web
    name: onward-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      # The Vercel address of the web client, e.g. https://onward.vercel.app (used for CORS).
      - key: CLIENT_ORIGIN
        sync: false
      # Optional AI keys, set in the dashboard only. OpenAI is tried first, then Gemini,
      # then the prepared answers.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Shows the solution panel in the Codespace for live demos. Set to false after judging.
      - key: DEMO_MODE
        value: 'true'
      - key: RECORD_SECRET
        generateValue: true
